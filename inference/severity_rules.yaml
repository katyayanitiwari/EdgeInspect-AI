# Severity rules for inference/severity.py.
# classes.*.major_area / critical_area are GENERATED by scripts/calibrate_severity.py.
# confidence, count_escalation, decisions and min_severity are hand-set starting
# values (assumptions) - edit them here and re-run tests/test_severity.py.
source: scripts/calibrate_severity.py on 1259 train label files (NEU-DET, seed 42).
  Areas in % of image. Data-relative assumption, not an industrial standard.
confidence:
  min: 0.25
  review: 0.5
count_escalation: 3
decisions:
  none: PASS
  minor: PASS_WITH_NOTE
  major: REWORK
  critical: REJECT
classes:
  crazing:
    min_severity: minor
    major_area: 21.06
    critical_area: 38.03
    train_boxes: 483
  inclusion:
    min_severity: minor
    major_area: 4.08
    critical_area: 18.04
    train_boxes: 691
  patches:
    min_severity: minor
    major_area: 9.45
    critical_area: 28.24
    train_boxes: 613
  pitted_surface:
    min_severity: minor
    major_area: 55.59
    critical_area: 97.01
    train_boxes: 300
  rolled-in_scale:
    min_severity: minor
    major_area: 12.39
    critical_area: 28.09
    train_boxes: 433
  scratches:
    min_severity: minor
    major_area: 7.52
    critical_area: 16.15
    train_boxes: 382
